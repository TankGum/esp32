; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Each demo is its own environment. Pick one in the VS Code status bar
; (or `pio run -e <name> -t upload`); default_envs is what plain `pio run` uses.
[platformio]
default_envs = device

[env]
platform = espressif32
; The physical board is a generic ESP32-S3 N16R8 DevKitC-style board; this board
; definition is used because its 16MB flash / 8MB octal PSRAM config matches.
board = adafruit_metro_esp32s3
framework = arduino
monitor_speed = 115200
; Serial over the built-in USB-Serial-JTAG: same port for bootloader and app,
; so uploads auto-reset (no BOOT button) and the monitor survives reboots.
build_flags = -DARDUINO_USB_MODE=1
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
; hard_reset leaves this board stuck in download mode; watchdog reset boots the app.
board_upload.after_reset = watchdog_reset

; WiFi web page to change the RGB LED color: open http://<board-ip>/
[env:wifi_led_web]
build_src_filter = +<wifi_led_web.cpp>

; BLE peripheral "ESP32-S3-Test": LED blue = advertising, green = phone connected
[env:ble_demo]
build_src_filter = +<ble_demo.cpp>

; Bluetooth remote for a phone ("ESP32 Remote", pairs as a BLE keyboard), controlled
; from a web page or the BOOT button: camera shutter, music, volume, typing text.
[env:ble_remote]
build_src_filter = +<ble_remote.cpp>
lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2

; Own WiFi "ESP32-Chat" with a captive-portal chat room (no internet needed).
; Also joins the home WiFi, so the chat is reachable on the LAN too.
[env:wifi_chat]
build_src_filter = +<wifi_chat.cpp>

; Set the board's WiFi from a phone: with no saved WiFi it opens "ESP32-Setup" with a
; captive-portal setup page. Hold BOOT 3 s to forget the saved WiFi.
[env:wifi_setup]
build_src_filter = +<wifi_setup.cpp>

; Standalone device firmware: on-screen app menu driven by the BOOT button
; (tap = next/act, hold = open/back), plus the phone web page. Screen text is anti-aliased
; Be Vietnam Pro, generated into include/ui_fonts.h by tools/gen_fonts.py.
[env:device]
build_src_filter = +<device.cpp>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/h2zero/NimBLE-Arduino/archive/refs/tags/1.4.3.zip
    nRF24/RF24@^1.4.10

; Board sends a photo + a question straight to the Claude API over HTTPS and shows the
; answer on the screen. The API key is stored on the board, entered from the web page.
[env:ai_ask]
build_src_filter = +<ai_ask.cpp>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6
    bblanchon/ArduinoJson@^7.2.0

; The board becomes a USB keyboard on its native USB port; BOOT opens Text Editor on the
; computer (Ubuntu GNOME) and types a message. Uses TinyUSB, so after this firmware runs,
; the next upload through the native port needs BOOT+RESET (or use the COM port).
[env:usb_keyboard]
build_src_filter = +<usb_keyboard.cpp>
build_flags = -DARDUINO_USB_MODE=0
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6

; 2.0" ST7789V 240x320 SPI display. Wiring: SCL=GPIO12 SDA=GPIO11 CS=GPIO10
; DC=GPIO9 RST=GPIO13, VCC to 3V3, GND to GND (module has no BLK pin).
[env:tft_demo]
build_src_filter = +<tft_demo.cpp>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6

; Send text and photos from a phone to the TFT: open http://esp32.local/ on the home WiFi.
[env:tft_web]
build_src_filter = +<tft_web.cpp>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6
